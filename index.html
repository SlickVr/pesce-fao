<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sicurezza Pesce FAO</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pesce FAO">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;min-height:100vh;padding:1rem;color:#1a1a1a}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:#666;margin-bottom:1.25rem}
.card{background:#fff;border:0.5px solid rgba(0,0,0,0.15);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
select,input[type=text]{width:100%;padding:10px 14px;font-size:16px;border:0.5px solid rgba(0,0,0,0.3);border-radius:8px;background:#fff;color:#1a1a1a;margin-bottom:10px;outline:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:9px;font-size:14px;font-weight:500;text-align:center;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;background:#f5f5f3;color:#666;cursor:pointer}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.divider{text-align:center;font-size:12px;color:#999;margin:2px 0 10px;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:0.5px;background:rgba(0,0,0,0.12)}
.divider::before{left:0}.divider::after{right:0}
.pane{display:none}.pane.active{display:block}
.warn{display:none;font-size:13px;color:#791F1F;background:#FCEBEB;border-radius:8px;padding:8px 12px;margin-bottom:10px}
.semaphore{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid rgba(0,0,0,0.15);margin-bottom:12px}
.dot{width:52px;height:52px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.dot.green{background:#EAF3DE}.dot.yellow{background:#FAEEDA}.dot.orange{background:#FAECE7}.dot.red{background:#FCEBEB}
.zone-title{font-size:17px;font-weight:600}
.zone-sub{font-size:13px;color:#666;margin-top:2px}
.risk-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;margin-top:4px}
.risk-green{background:#EAF3DE;color:#27500A}.risk-yellow{background:#FAEEDA;color:#633806}
.risk-orange{background:#FAECE7;color:#712B13}.risk-red{background:#FCEBEB;color:#791F1F}
.section-title{font-size:13px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 8px}
.indicator-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid rgba(0,0,0,0.1)}
.indicator-row:last-child{border-bottom:none}
.ind-name{font-size:14px}
.ind-val{font-size:13px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;margin-left:8px}
.ind-low{background:#EAF3DE;color:#27500A}.ind-med{background:#FAEEDA;color:#633806}
.ind-high{background:#FAECE7;color:#712B13}.ind-vhigh{background:#FCEBEB;color:#791F1F}
.rec-box{background:#f5f5f3;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6}
.species-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;border:0.5px solid rgba(0,0,0,0.15);background:#f5f5f3;color:#666}
.source-note{font-size:11px;color:#999;text-align:center;margin-top:12px;line-height:1.5}
.result-card{display:none}
.zone-rank{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:0.5px solid rgba(0,0,0,0.1);cursor:pointer}
.zone-rank:last-child{border-bottom:none}
.rank-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.rank-dot.green{background:#7CB342}.rank-dot.yellow{background:#E0A93B}.rank-dot.orange{background:#D9743D}.rank-dot.red{background:#D14343}
.rank-name{font-size:14px;font-weight:500;flex:1}
.rank-zone{font-size:12px;color:#999}
.hint{font-size:12px;color:#999;margin-bottom:10px}
</style>
</head>
<body>

<div class="card">
  <h1>&#x1F41F; Sicurezza pesce</h1>
  <p class="sub">Qualit&#224; delle acque per zona FAO &middot; funziona offline</p>

  <div class="tabs">
    <div class="tab active" id="tabZone" onclick="switchTab('zone')">Per zona</div>
    <div class="tab" id="tabSpecies" onclick="switchTab('species')">Per specie</div>
  </div>

  <div class="pane active" id="paneZone">
    <select id="faoSelect" onchange="onSelectChange()">
      <option value="">&#8212; Scegli zona FAO &#8212;</option>
    </select>
    <div class="divider">oppure</div>
    <input type="text" id="faoManual" placeholder="Digita codice FAO (es. 37.2.1)" oninput="onManualInput()">
    <div class="warn" id="zoneWarn">Codice FAO non presente nel database.</div>
  </div>

  <div class="pane" id="paneSpecies">
    <select id="speciesSelect" onchange="renderSpecies()">
      <option value="">&#8212; Scegli una specie &#8212;</option>
    </select>
    <p class="hint">Zone dove si pesca, dalla pi&#249; pulita alla pi&#249; critica.</p>
    <div id="speciesRanking"></div>
  </div>
</div>

<div class="card result-card" id="resultCard">
  <div class="semaphore">
    <div class="dot" id="dot">&#x1F41F;</div>
    <div>
      <div class="zone-title" id="zoneName">&#8212;</div>
      <div class="zone-sub" id="zoneSub">&#8212;</div>
      <span class="risk-badge" id="riskBadge">&#8212;</span>
    </div>
  </div>
  <div class="section-title">Indicatori di inquinamento</div>
  <div id="indicators"></div>
  <div class="section-title">Specie pi&#249; sensibili</div>
  <div class="species-chips" id="speciesChips"></div>
  <div class="section-title">Raccomandazioni</div>
  <div class="rec-box" id="recBox">&#8212;</div>
  <p class="source-note" id="sourceNote"></p>
</div>

var ORDER = ["27","31","34","41","47","67","77","81","87","47","51","57","61","71","37","37.1","37.2","37.2.1","37.3","37.4","18","48","58","88"];
var LABELS = {"27":"27 - Atlantico NE (Norvegia/UK)","31":"31 - Atlantico C-Ovest (Caraibi)","34":"34 - Atlantico C-Est (Africa W)","41":"41 - Atlantico SO (Argentina)","47":"47 - Atlantico SE (Namibia/Sudafrica)","61":"61 - Pacifico NO (Giappone/Cina)","67":"67 - Pacifico NE (Alaska)","71":"71 - Pacifico C-Ovest","77":"77 - Pacifico C-Est","81":"81 - Pacifico SO (Nuova Zelanda)","87":"87 - Pacifico SE (Peru/Cile)","51":"51 - Oceano Indiano O","57":"57 - Oceano Indiano E","37":"37 - Mediterraneo e Mar Nero","37.1":"37.1 - Mediterraneo Occidentale","37.2":"37.2 - Mediterraneo Centrale","37.2.1":"37.2.1 - Mar Adriatico","37.3":"37.3 - Mediterraneo Orientale","37.4":"37.4 - Mar Nero","18":"18 - Artico","48":"48 - Atlantico Antartico","58":"58 - Indiano Antartico","88":"88 - Pacifico Antartico"};

var levelMap = {basso:["ind-low","Basso"],medio:["ind-med","Medio"],alto:["ind-high","Alto"],"molto alto":["ind-vhigh","Molto alto"]};
var colorMap = {green:"green",yellow:"yellow",orange:"orange",red:"red"};
var badgeClass = {green:"risk-green",yellow:"risk-yellow",orange:"risk-orange",red:"risk-red"};
var riskLabel = {basso:"Rischio basso",medio:"Rischio medio",alto:"Rischio alto","molto alto":"Rischio molto alto"};
var rankOrder = {green:0,yellow:1,orange:2,red:3};

// Popola select zone
var sel = document.getElementById("faoSelect");
var seen = {};
for (var i = 0; i < ORDER.length; i++) {
  var k = ORDER[i];
  if (seen[k] || !DATA[k]) continue;
  seen[k] = true;
  var o = document.createElement("option");
  o.value = k;
  o.textContent = LABELS[k] || k;
  sel.appendChild(o);
}

// Costruisce indice specie
var speciesIndex = {};
var keys = Object.keys(DATA);
for (var i = 0; i < keys.length; i++) {
  var code = keys[i];
  var sp = DATA[code].sensibleSpecies;
  for (var j = 0; j < sp.length; j++) {
    var raw = sp[j];
    var norm = raw.replace(/\s*\(.*?\)/g,"").trim().toLowerCase();
    if (!speciesIndex[norm]) speciesIndex[norm] = {display: raw.replace(/\s*\(.*?\)/g,"").trim(), zones: []};
    speciesIndex[norm].zones.push(code);
  }
}

// Popola select specie
var spSel = document.getElementById("speciesSelect");
var spKeys = Object.keys(speciesIndex).sort(function(a,b){ return speciesIndex[a].display.localeCompare(speciesIndex[b].display,"it"); });
for (var i = 0; i < spKeys.length; i++) {
  var o = document.createElement("option");
  o.value = spKeys[i];
  o.textContent = speciesIndex[spKeys[i]].display;
  spSel.appendChild(o);
}

function switchTab(which) {
  var isZone = which === "zone";
  document.getElementById("tabZone").className = "tab" + (isZone ? " active" : "");
  document.getElementById("tabSpecies").className = "tab" + (!isZone ? " active" : "");
  document.getElementById("paneZone").className = "pane" + (isZone ? " active" : "");
  document.getElementById("paneSpecies").className = "pane" + (!isZone ? " active" : "");
  document.getElementById("resultCard").style.display = "none";
}

function normalizeCode(raw) {
  return raw.trim().replace(/[,\s]+/g,".").replace(/\.+/g,".").replace(/^\.|\.$/g,"");
}

function onSelectChange() {
  if (sel.value) {
    document.getElementById("faoManual").value = "";
    document.getElementById("zoneWarn").style.display = "none";
    render(sel.value);
  }
}

function onManualInput() {
  sel.value = "";
  var val = document.getElementById("faoManual").value;
  if (!val.trim()) {
    document.getElementById("zoneWarn").style.display = "none";
    document.getElementById("resultCard").style.display = "none";
    return;
  }
  var code = normalizeCode(val);
  if (DATA[code]) {
    document.getElementById("zoneWarn").style.display = "none";
    render(code);
  } else {
    document.getElementById("zoneWarn").style.display = "block";
    document.getElementById("resultCard").style.display = "none";
  }
}

function renderSpecies() {
  var key = spSel.value;
  var out = document.getElementById("speciesRanking");
  document.getElementById("resultCard").style.display = "none";
  if (!key) { out.innerHTML = ""; return; }
  var zones = speciesIndex[key].zones.slice().sort(function(a,b){ return rankOrder[DATA[a].riskColor] - rankOrder[DATA[b].riskColor]; });
  var html = "";
  for (var i = 0; i < zones.length; i++) {
    var c = zones[i];
    var d = DATA[c];
    html += '<div class="zone-rank" onclick="render(\'' + c + '\')"><span class="rank-dot ' + (colorMap[d.riskColor]||"yellow") + '"></span><div style="flex:1"><div class="rank-name">' + d.zoneName + '</div><div class="rank-zone">' + d.zoneSub + ' &middot; ' + (riskLabel[d.riskLevel]||d.riskLevel) + '</div></div><span style="color:#ccc">&#8250;</span></div>';
  }
  out.innerHTML = html;
}

function render(code) {
  var d = DATA[code];
  var card = document.getElementById("resultCard");
  if (!d) { card.style.display = "none"; return; }

  var dot = document.getElementById("dot");
  dot.className = "dot " + (colorMap[d.riskColor]||"yellow");
  dot.innerHTML = d.emoji || "&#x1F41F;";

  document.getElementById("zoneName").textContent = d.zoneName;
  document.getElementById("zoneSub").textContent = d.zoneSub;
  var badge = document.getElementById("riskBadge");
  badge.textContent = riskLabel[d.riskLevel] || d.riskLevel;
  badge.className = "risk-badge " + (badgeClass[d.riskColor]||"risk-yellow");

  var indHTML = "";
  for (var i = 0; i < d.indicators.length; i++) {
    var ind = d.indicators[i];
    var lm = levelMap[ind.level] || ["ind-med","N/D"];
    indHTML += '<div class="indicator-row"><span class="ind-name">' + ind.name + '<br><span style="font-size:11px;color:#999">' + (ind.note||"") + '</span></span><span class="ind-val ' + lm[0] + '">' + lm[1] + '</span></div>';
  }
  document.getElementById("indicators").innerHTML = indHTML;

  var chipHTML = "";
  for (var i = 0; i < d.sensibleSpecies.length; i++) {
    chipHTML += '<span class="chip">' + d.sensibleSpecies[i] + '</span>';
  }
  document.getElementById("speciesChips").innerHTML = chipHTML;
  document.getElementById("recBox").textContent = d.recommendation;
  document.getElementById("sourceNote").textContent = d.sourceNote;
  card.style.display = "block";
  card.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>
</body>
</html>
